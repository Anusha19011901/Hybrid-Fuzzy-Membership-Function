[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hfm"
version = "0.1.0"
description = "Reimplementation of a patented hybrid fuzzy membership model for cardiac state prediction"
readme = "README.md"
requires-python = ">=3.10"
# license: TODO, see README "Patent, license and credits"
authors = [{ name = "Anusha Seshadri" }]
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3,<1.6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
keras = ["tensorflow>=2.13"]  # only for hfm.keras_optional
dev = ["pytest>=7", "nbformat", "nbconvert", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
