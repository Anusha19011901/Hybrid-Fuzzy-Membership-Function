[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hfm"
version = "0.1.0"
description = "Reimplementation of a patented hybrid fuzzy membership model for cardiac state prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anusha Seshadri" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-fuzzy>=0.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
keras = ["tensorflow>=2.13"]  # only for hfm.keras_optional
dev = ["pytest>=7", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
